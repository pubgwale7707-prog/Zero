name: Build APK

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK packages + NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;24.0.8215888" "platform-tools"

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Copy APK to repo root
        run: |
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*-release.apk ./Zero.apk
          ls -lh ./Zero.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zero-apk
          path: ./Zero.apk

      - name: Commit APK to repo root [skip ci]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Zero.apk
          git commit -m "Add built APK to repo root [skip ci]" || echo "Nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
